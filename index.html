<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#082826"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>مسابقة الأسئلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Almarai:wght@400;700&family=Changa:wght@400;700&family=El+Messiri:wght@400;700&family=Reem+Kufi:wght@400;700&family=Amiri:wght@400;700&family=Lalezar&family=Noto+Kufi+Arabic:wght@400;700;900&family=Readex+Pro:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Marhey:wght@400;700&display=swap">
<style>
/* Layout: modern Islamic game-show — emerald night ground with a gold 8-point-star lattice; arches frame the logo, section cards and result popups; question numbers sit inside Rub el Hizb stars. All colors are tokens the settings panel rewrites at runtime. */
:root{
  --bg:#082826; --bg2:#0f4a43; --primary:#d9ad5b; --accent:#2f8f83;
  --text:#fbf6e9; --muted:#b5cec6; --cardText:#ffffff;
  --correct:#2fae6b; --wrong:#c8453b; --overlay:.45; --pattern:.10;
  --font:'Tajawal', 'Cairo', system-ui, sans-serif;
  --head:'El Messiri', 'Cairo', system-ui, sans-serif;
  --bism:'Aref Ruqaa', 'Amiri', serif;
  --scale:1; --radius:16px;
  --gold-soft:color-mix(in srgb, var(--primary) 35%, transparent);
  --gold-faint:color-mix(in srgb, var(--primary) 16%, transparent);
  --card:color-mix(in srgb, var(--text) 6%, transparent);
  --tile:color-mix(in srgb, var(--bg) 82%, var(--primary));
  --panel:#ffffff; --panelText:#13312d; --panelMuted:#5f7a74; --panelLine:#dfe7e3; --panelSoft:#f2f6f3; --panelAccent:#0f6b5c;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:calc(16px * var(--scale));overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
#app{position:relative;height:100%;direction:rtl}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,var(--bg2),var(--bg) 75%);background-size:cover;background-position:center;z-index:0}
.bg::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:0}
.bg.has-img::after{opacity:var(--overlay)}
.pattern{position:absolute;inset:0;z-index:0;background:var(--primary);opacity:var(--pattern);-webkit-mask:var(--pat) repeat center/96px;mask:var(--pat) repeat center/96px;pointer-events:none}
.vign{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 55% 50% at 50% 45%,var(--bg) 10%,transparent 100%);opacity:.75}
.screen{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.screen[hidden]{display:none!important}
h1,h2,h3{font-family:var(--head);text-wrap:balance;margin:0}

/* ornament divider */
.orn{display:flex;align-items:center;gap:12px;color:var(--primary);width:min(360px,80%)}
.orn i{flex:1;height:1px;background:linear-gradient(to left,transparent,var(--primary))}
.orn i:last-child{background:linear-gradient(to right,transparent,var(--primary))}
.orn svg{width:22px;height:22px;flex:none}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--gold-faint)}
.bar .grow{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bar h2{font-size:1.5em;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar img.mini{height:44px;width:auto;object-fit:contain}
.iconbtn{background:var(--card);border:1px solid var(--gold-soft);border-radius:12px;padding:10px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:700;backdrop-filter:blur(8px);transition:background .15s,border-color .15s}
.iconbtn:hover{background:var(--gold-faint);border-color:var(--primary)}
.iconbtn svg{width:20px;height:20px}
.score{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 75%,#fff),var(--primary));color:var(--bg);font-weight:900;border-radius:12px;padding:10px 16px;font-variant-numeric:tabular-nums}
.score::before{content:"";width:14px;height:14px;background:currentColor;clip-path:polygon(50% 0,61% 25%,85% 15%,75% 39%,100% 50%,75% 61%,85% 85%,61% 75%,50% 100%,39% 75%,15% 85%,25% 61%,0 50%,25% 39%,15% 15%,39% 25%)}

/* home */
.home{align-items:center;justify-content:center;text-align:center;gap:16px}
.bism{font-family:var(--bism);font-size:1.7em;color:var(--primary);margin:0;opacity:.95}
.arch{position:relative;flex:none;width:min(80vw,var(--logoSize,220px),calc(40vh * var(--ar,.83)));aspect-ratio:var(--ar,.83);display:block;padding:0;
  border-radius:50% 50% 10px 10px / 38% 38% 10px 10px;border:1.5px solid var(--primary);
  background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--primary) 20%,transparent),transparent 70%),color-mix(in srgb,var(--bg) 55%,transparent);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.arch::before{content:"";position:absolute;inset:7px;border-radius:inherit;border:1px solid var(--gold-soft);pointer-events:none}
.arch img{position:absolute;top:calc(var(--archTop,22%));bottom:9%;left:12%;right:12%;width:76%;height:calc(91% - var(--archTop,22%));max-width:none;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));animation:float 5s ease-in-out infinite}
.arch .star{width:clamp(90px,14vw,150px);height:auto;aspect-ratio:1;color:var(--primary);animation:spin 40s linear infinite}
.arch .star{position:absolute;inset:0;margin:auto}
.arch.plain{border:0;background:none;box-shadow:none}
.arch.plain::before{display:none}
.arch.plain img{inset:0;width:100%;height:100%}
.home h1{font-size:clamp(2.2em,7vw,4.2em);color:var(--text);line-height:1.2}
.home h1 em{font-style:normal;color:var(--primary)}
.home p.sub{font-size:1.2em;color:var(--muted);margin:0;max-width:42ch}
.big{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--primary) 70%,#fff),var(--primary) 55%,color-mix(in srgb,var(--primary) 80%,#000));color:var(--bg);border:0;border-radius:14px;padding:15px 56px;font-size:1.45em;font-weight:900;font-family:var(--head);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 60%,#000),0 0 0 5px var(--gold-faint),0 14px 36px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.big:hover{transform:translateY(-2px);box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 60%,#000),0 0 0 8px var(--gold-faint),0 18px 40px rgba(0,0,0,.4)}
.big:active{transform:translateY(1px)}
.home .corner{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px))}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* section cards: arches */
.grid{flex:1 1 auto;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--gap,20px);width:100%}
.cat{position:relative;flex:none;width:var(--cw,220px);height:var(--ch,250px);font-size:calc(16px * var(--scale) * var(--cs,1));border:0;padding:1.4em 1.1em 1.1em;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;text-align:center;color:var(--cardText);
  background:linear-gradient(170deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)) 45%,#000));
  border-radius:50% 50% var(--radius) var(--radius) / var(--av,105px) var(--av,105px) var(--radius) var(--radius);overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .25s}
.cat:hover{transform:translateY(-6px)}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat .cpat{position:absolute;inset:0;background:#fff;opacity:.09;-webkit-mask:var(--pat) repeat center/70px;mask:var(--pat) repeat center/70px}
.cat .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 60%)}
.cat .frame{position:absolute;inset:8px;border:1.5px solid color-mix(in srgb,var(--primary) 75%,#fff);border-radius:50% 50% calc(var(--radius) - 6px) calc(var(--radius) - 6px) / calc(var(--av,105px) - 7px) calc(var(--av,105px) - 7px) calc(var(--radius) - 6px) calc(var(--radius) - 6px);opacity:.8;pointer-events:none}
.cat .ic{position:absolute;top:max(26px,calc(var(--av,105px) * .32));left:50%;transform:translateX(-50%);font-size:3em;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.cat b{position:relative;font-family:var(--head);font-size:1.5em}
.cat small{position:relative;opacity:.85}
.cat .prog{position:relative;width:80%;height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.cat .prog i{display:block;height:100%;background:var(--primary)}

@media (max-width:520px){
  .bar .grow{order:-1;flex-basis:100%}
  .bar .iconbtn span{display:none}
  .tchip{padding:6px 10px;font-size:.92em}
  .life{font-size:.9em}
}
/* number tiles: Rub el Hizb stars */
.nums{flex:1 1 auto;min-height:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--ng,14px);width:100%}
.num{position:relative;flex:none;width:var(--ns,140px);height:var(--ns,140px);font-size:calc(var(--ns,140px) * .16);border:0;background:none;padding:0;display:grid;place-items:center;font-family:var(--head);color:var(--primary);font-variant-numeric:tabular-nums}
.num::before,.num::after{content:"";position:absolute;inset:17%;background:var(--tile);border:2px solid var(--primary);border-radius:4px;transition:transform .35s,background .2s}
.num::after{transform:rotate(45deg)}
.num:hover:not(:disabled)::before{transform:rotate(22.5deg)}
.num:hover:not(:disabled)::after{transform:rotate(67.5deg)}
.num .in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.num .nn{font-size:2em;font-weight:700}
.num .pts{font-size:.72em;font-weight:700;color:var(--muted);margin-top:4px;font-family:var(--font)}
.num.right,.num.wrong{color:#fff}
.num.right::before,.num.right::after{background:var(--correct)}
.num.wrong::before,.num.wrong::after{background:var(--wrong)}
.num.right .pts,.num.wrong .pts{color:rgba(255,255,255,.85)}
.num .mark{position:absolute;z-index:1;top:8%;font-size:1em;color:#fff;background:var(--bg);border:1.5px solid var(--primary);width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center}
.num:disabled{cursor:default}
.cathead{text-align:center;margin-bottom:22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cathead h1{font-size:clamp(1.8em,5vw,2.8em);color:var(--primary)}

/* question */
.qwrap{max-width:min(1500px,100%);width:100%;margin-inline:auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,30px);flex:1;font-size:clamp(15px,calc(.7vw + .95vh),30px)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-weight:700}
.qtext{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 70%,transparent),color-mix(in srgb,var(--bg) 70%,transparent));border:1px solid var(--gold-soft);border-radius:var(--radius);padding:1.4em 1.3em;font-family:var(--head);font-size:2em;line-height:1.6;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.qtext::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold-faint);border-radius:calc(var(--radius) - 5px);pointer-events:none}
.qtext .cn{position:absolute;width:16px;height:16px;background:var(--primary);clip-path:polygon(50% 0,61% 25%,85% 15%,75% 39%,100% 50%,75% 61%,85% 85%,61% 75%,50% 100%,39% 75%,15% 85%,25% 61%,0 50%,25% 39%,15% 15%,39% 25%)}
.qtext .cn:nth-child(1){top:-8px;right:-8px}.qtext .cn:nth-child(2){top:-8px;left:-8px}.qtext .cn:nth-child(3){bottom:-8px;right:-8px}.qtext .cn:nth-child(4){bottom:-8px;left:-8px}
.qimg{max-height:30vh;max-width:100%;object-fit:contain;border-radius:12px;align-self:center;border:1px solid var(--gold-soft)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.8vh,24px)}
@media (max-width:640px){.choices{grid-template-columns:1fr}.choice{min-height:0;padding:.65em .9em;font-size:1.25em}.qtext{padding:1em}}
.choice{display:flex;align-items:center;gap:14px;text-align:right;background:var(--card);color:var(--text);border:1px solid var(--gold-soft);border-radius:var(--radius);padding:.85em 1em;min-height:3.6em;font-size:1.4em;font-weight:700;transition:transform .12s,background .15s,border-color .15s;min-width:0;backdrop-filter:blur(6px)}
.choice span.t{min-width:0;overflow-wrap:anywhere}
.choice:hover:not(:disabled){background:var(--gold-faint);border-color:var(--primary);transform:translateY(-2px)}
.choice .l{flex:none;width:2.1em;height:2.1em;display:grid;place-items:center;background:var(--primary);color:var(--bg);font-weight:900;font-family:var(--head);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.choice.is-right{background:var(--correct);border-color:var(--correct);color:#fff}
.choice.is-wrong{background:var(--wrong);border-color:var(--wrong);color:#fff}
.choice.is-right .l,.choice.is-wrong .l{background:#fff;color:#222}
.choice:disabled{cursor:default}
.timer{display:flex;align-items:center;gap:10px}
.timer .ring{width:3.4em;height:3.4em}
.timer .ring circle{fill:none;stroke-width:5}
.timer b{font-size:1.3em;color:var(--text);font-variant-numeric:tabular-nums}
.after{display:flex;justify-content:center}

/* result popups: arched cards */
.pop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,rgba(0,0,0,.5));backdrop-filter:blur(4px);direction:rtl}
.pop[hidden]{display:none!important}
.popcard{position:relative;z-index:2;width:min(440px,100%);padding:64px 28px 28px;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;
  border-radius:50% 50% 22px 22px / 130px 130px 22px 22px;box-shadow:0 0 0 1.5px var(--primary),0 0 0 8px var(--gold-faint),0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.popcard::before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.35);border-radius:50% 50% 16px 16px / 122px 122px 16px 16px;pointer-events:none}
.popcard::after{content:"";position:absolute;inset:0;background:#fff;opacity:.07;-webkit-mask:var(--pat) repeat center/80px;mask:var(--pat) repeat center/80px;pointer-events:none}
.popcard>*{position:relative;z-index:1}
.pop.ok .popcard{background:linear-gradient(170deg,color-mix(in srgb,var(--correct) 85%,#fff),color-mix(in srgb,var(--correct) 55%,#000));animation:popin .6s cubic-bezier(.2,1.5,.4,1)}
.pop.bad .popcard{background:linear-gradient(170deg,var(--wrong),color-mix(in srgb,var(--wrong) 45%,#000));animation:popin .4s ease-out, shake .5s .4s}
.medal{position:relative;width:150px;height:150px;display:grid;place-items:center}
.medal svg{position:absolute;inset:0;width:100%;height:100%;color:var(--primary)}
.pop.ok .medal svg{animation:spin 12s linear infinite;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--primary) 70%,transparent))}
.pop.bad .medal svg{color:rgba(255,255,255,.35)}
.popcard .emo{position:relative;font-size:4.6em;line-height:1}
.pop.ok .emo{animation:bounce 1s .3s infinite}
.pop.bad .emo{animation:droop 2.4s ease-in-out infinite}
.popcard img.pimg{position:relative;max-width:110px;max-height:110px;object-fit:contain;border-radius:50%}
.popcard h2{font-size:2.1em}
.popcard p{margin:0;font-size:1.12em;opacity:.95}
.popcard .pts{background:rgba(0,0,0,.2);border:1px solid var(--primary);color:color-mix(in srgb,var(--primary) 60%,#fff);border-radius:999px;padding:6px 18px;font-weight:900}
.popcard .ans{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 16px;width:100%}
.popcard .big{font-size:1.15em;padding:11px 44px;margin-top:6px}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
@keyframes popin{from{transform:scale(.4) translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes bounce{50%{transform:translateY(-12px) scale(1.08)}}
@keyframes droop{50%{transform:translateY(6px) rotate(-6deg)}}


/* screen transitions */
.screen:not([hidden]){animation:scrIn .35s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(12px)}}
.home .corner{display:flex;gap:8px}
/* team strip */
.tstrip{flex-basis:100%;order:10;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tstrip:empty{display:none}
.tchip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--tc) 70%,transparent);font-weight:700;transition:background .2s,box-shadow .2s}
.tchip i{width:12px;height:12px;border-radius:50%;background:var(--tc);flex:none}
.tchip b{font-variant-numeric:tabular-nums;color:var(--primary);font-size:1.15em;font-family:var(--head)}
.tchip.on{background:color-mix(in srgb,var(--tc) 38%,transparent);border-color:var(--primary);box-shadow:0 0 0 3px var(--gold-faint)}
.tchip.on::after{content:"الدور";font-size:.72em;background:var(--primary);color:var(--bg);padding:2px 8px;border-radius:999px}
.tchip.bump b{animation:bump .7s}
@keyframes bump{40%{transform:scale(1.6)}}
/* lifelines */
.lifes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lifes[hidden]{display:none!important}
.life{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--gold-soft);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700;backdrop-filter:blur(6px)}
.life:hover:not(:disabled){border-color:var(--primary);background:var(--gold-faint)}
.life .ico{width:30px;height:30px;display:grid;place-items:center;background:var(--primary);color:var(--bg);border-radius:50%;font-weight:900;font-size:.95em}
.life small{color:var(--muted);font-variant-numeric:tabular-nums}
.life:disabled{opacity:.38;cursor:default}
.choice.gone{visibility:hidden}
/* team setup */
.twrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;max-width:1000px;width:100%;margin-inline:auto}
.twrap h1{font-size:clamp(1.8em,5vw,3em);color:var(--primary);text-align:center}
.tsetup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:16px;width:100%}
.tcard{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--gold-soft);border-inline-start:7px solid var(--tc);backdrop-filter:blur(6px)}
.tcard .tn{font:700 1.4em var(--head);color:var(--primary);width:1.4em;text-align:center}
.tcard input[type=text]{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--gold-soft);color:var(--text);font:700 1.25em var(--head);padding:6px 2px}
.tcard input[type=color]{width:38px;height:38px;border:2px solid var(--gold-soft);background:none;padding:0;border-radius:50%;overflow:hidden;cursor:pointer;flex:none}
.tcard input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.tcard input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.tcard .x{background:none;border:0;color:var(--muted);font-size:1.2em;padding:4px 8px}
.tcard .x:hover{color:var(--wrong)}
.tadd{border:1.5px dashed var(--gold-soft);background:transparent;border-radius:var(--radius);padding:16px;color:var(--primary);font-weight:700;font-size:1.1em;min-height:70px}
.tadd:hover{background:var(--gold-faint)}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.ghost{background:transparent;border:1.5px solid var(--gold-soft);color:var(--text);border-radius:14px;padding:13px 28px;font-weight:700;font-size:1.1em}
.ghost:hover{border-color:var(--primary);background:var(--gold-faint)}
.hint-keys{color:var(--muted);font-size:.9em;text-align:center}
/* scoreboard */
.board{max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.board h1{text-align:center;color:var(--primary);font-size:clamp(1.8em,5vw,2.8em);margin-bottom:8px}
.brow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:16px;padding:12px 18px;background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--radius);backdrop-filter:blur(6px);animation:scrIn .5s both}
.brow.first{border-color:var(--primary);box-shadow:0 0 0 4px var(--gold-faint)}
.rk{width:50px;height:50px;display:grid;place-items:center;font:700 1.25em var(--head);color:var(--bg);background:var(--primary);clip-path:polygon(50% 0,61% 25%,85% 15%,75% 39%,100% 50%,75% 61%,85% 85%,61% 75%,50% 100%,39% 75%,15% 85%,25% 61%,0 50%,25% 39%,15% 15%,39% 25%)}
.brow .nm{display:flex;flex-direction:column;gap:8px;min-width:0}
.brow .nm b{font-family:var(--head);font-size:1.3em;overflow-wrap:anywhere}
.bar2{height:10px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--tc);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.brow .sc{font:900 2em var(--head);color:var(--primary);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
/* end of round */
.endwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.endwrap h1{font-size:clamp(2em,6vw,3.6em);color:var(--primary)}
.endwrap .sub{color:var(--muted);font-size:1.2em;margin:0}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;width:min(720px,100%);height:min(44vh,360px);margin-top:10px}
.pod{flex:1;max-width:210px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.pod .crown{font-size:2.6em;line-height:1;animation:bounce 1.4s infinite}
.pod .who{font:700 1.25em var(--head);overflow-wrap:anywhere}
.pod .pts{color:var(--primary);font-weight:900;font-variant-numeric:tabular-nums}
.pod .blk{width:100%;border-radius:16px 16px 0 0;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 45%,#000));display:flex;justify-content:center;padding-top:14px;font:900 2.4em var(--head);color:#fff;border:1.5px solid var(--primary);border-bottom:0;transform-origin:bottom;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.pod.p1 .blk{height:62%;animation-delay:.6s}.pod.p2 .blk{height:46%;animation-delay:.3s}.pod.p3 .blk{height:34%}
@keyframes rise{from{transform:scaleY(0)}}
.solo-score{font:900 clamp(4em,14vw,7em) var(--head);color:var(--primary);line-height:1}
.endrest{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.popcard .tn{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:999px;padding:5px 14px;font-weight:700}
.popcard .tn i{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.popcard .exp{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;width:100%;line-height:1.7;font-size:.98em}


/* gift reveal: full screen */
.gift{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(ellipse at center,var(--bg2),var(--bg) 72%);direction:rtl;text-align:center;overflow:hidden;font-family:var(--font)}
.gift[hidden]{display:none!important}
.gift .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,var(--gold-faint) 0 7deg,transparent 7deg 18deg);opacity:.25;animation:spin 40s linear infinite;pointer-events:none;transition:opacity .8s}
.gift.open .rays{opacity:1;animation-duration:18s}
.gift .gpat{position:absolute;inset:0;background:var(--primary);opacity:.07;-webkit-mask:var(--pat) repeat center/96px;mask:var(--pat) repeat center/96px;pointer-events:none}
.gift>*:not(.rays):not(.gpat){position:relative}
.gift h2{font-size:clamp(1.8em,5vw,3.6em);color:var(--primary);text-shadow:0 4px 20px rgba(0,0,0,.4)}
.gift .gteam{display:inline-flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1.5px solid var(--tc,var(--primary));border-radius:999px;padding:6px 18px;font-weight:700;font-size:clamp(1em,2vw,1.4em)}
.gift .gteam i{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.gift .stage{width:min(88vw,120vh);height:min(52vh,70vw);display:grid;place-items:center}
.gift .box{background:none;border:0;padding:0;font-size:min(34vh,48vw);line-height:1;cursor:pointer;animation:wobble 1.1s ease-in-out infinite;filter:drop-shadow(0 20px 40px rgba(0,0,0,.45))}
.gift .box:focus-visible{outline:none}
.gift .prize{display:none;max-width:100%;max-height:100%;object-fit:contain;border-radius:22px;filter:drop-shadow(0 24px 50px rgba(0,0,0,.5));animation:prizeIn .9s cubic-bezier(.2,1.4,.4,1)}
.gift .prize.emo{font-size:min(36vh,50vw);line-height:1}
.gift.open .box{display:none}
.gift.open .prize{display:block}
.gift .gname{display:none;font:900 clamp(2em,6.5vw,5em) var(--head);color:var(--text);line-height:1.2;text-wrap:balance;animation:scrIn .6s .3s both}
.gift .gdesc{display:none;color:var(--muted);font-size:clamp(1em,2.2vw,1.5em);margin:0;max-width:50ch}
.gift.open .gname,.gift.open .gdesc{display:block}
.gift .tap{color:var(--muted);font-size:clamp(1em,2vw,1.3em);margin:0;animation:pulse 1.6s infinite}
.gift.open .tap{display:none}
.gift .big{display:none}
.gift.open .big{display:inline-block}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg) scale(1.03)}80%{transform:rotate(3deg)}}
@keyframes prizeIn{from{transform:scale(.15) rotate(-25deg);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
.num .gmark{position:absolute;z-index:1;bottom:6%;font-size:.9em}
.giftlist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gchip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--gold-soft);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700}
.gchip img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.gchip small{color:var(--muted);font-weight:400}
.gedit{border:1px solid var(--panelLine);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;margin-top:12px;background:#fff}
.gedit .gpv{width:96px;height:96px;border-radius:12px;background:var(--panelSoft) center/contain no-repeat;display:grid;place-items:center;font-size:3em;border:1px dashed var(--panelLine)}
@media (max-width:560px){.gedit{grid-template-columns:1fr}}


/* database tab */
.dbstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.dbstat div{background:var(--panelSoft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.dbstat b{font-size:1.5em;font-variant-numeric:tabular-nums}
.dbstat span{color:var(--panelMuted);font-size:.88em}
.dbbadge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:.92em}
.dbbadge i{width:9px;height:9px;border-radius:50%;background:currentColor}
.dbbadge.on{background:#e3f4ec;color:#11734b}.dbbadge.off{background:#fdf1e2;color:#9a5a00}.dbbadge.err{background:#fdecec;color:#b42323}
.dbfilter{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.dbfilter input{flex:1;min-width:180px}
.panel .dbfilter select{width:auto;flex:none}
.panel .dbfilter input{width:auto}
.dbtable-wrap{overflow-x:auto;border:1px solid var(--panelLine);border-radius:12px}
.dbtable{width:100%;border-collapse:collapse;font-size:.92em}
.dbtable th{background:var(--panelSoft);text-align:right;padding:9px 10px;font-weight:700;white-space:nowrap;position:sticky;top:0}
.dbtable td{padding:8px 10px;border-top:1px solid var(--panelLine);vertical-align:top}
.dbtable tr.r:hover td{background:#f7faf8;cursor:pointer}
.dbtable .ok{color:#11734b;font-weight:700}
.dbtable .th{width:44px;height:34px;border-radius:6px;object-fit:cover;background:var(--panelSoft)}
.dbtable td.n{font-variant-numeric:tabular-nums;color:var(--panelMuted)}
.cloudnote{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:40;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 14px;font-size:.85em;font-family:'Tajawal',sans-serif;backdrop-filter:blur(6px)}

/* ---------- settings panel (light, neutral so it reads regardless of the game's colors) ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,8,30,.6);display:grid;place-items:center;padding:16px;direction:rtl}
.modal[hidden]{display:none!important}
.panel{background:var(--panel);color:var(--panelText);font-family:'Tajawal','Cairo',system-ui,sans-serif;font-size:15px;border-radius:20px;width:min(1080px,100%);height:min(760px,100%);display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.panel header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--panelLine)}
.panel header h3{font-size:1.25em;font-family:'Tajawal',sans-serif;font-weight:900}
.panel header .saved{color:var(--panelMuted);font-size:.9em;margin-inline-start:auto}
.tabs{display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--panelSoft);border-inline-end:1px solid var(--panelLine);overflow:auto}
.tabs button{border:0;background:transparent;text-align:right;padding:11px 14px;border-radius:10px;font-weight:700;color:var(--panelText)}
.tabs button.on{background:var(--panelAccent);color:#fff}
.tabs button:hover:not(.on){background:var(--panelLine)}
.pbody{overflow:auto;padding:20px 24px 40px}
.pbody h4{margin:22px 0 10px;font-size:1.05em;color:var(--panelAccent)}
.pbody h4:first-child{margin-top:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:1/-1}
.f>label,.f>.lb{font-weight:700;font-size:.92em}
.f .hint{color:var(--panelMuted);font-size:.85em}
.panel input[type=text],.panel input[type=number],.panel input[type=password],.panel select,.panel textarea{width:100%;border:1px solid var(--panelLine);border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--panelText)}
.panel textarea{min-height:70px;resize:vertical}
.panel input[type=color]{width:52px;height:38px;border:1px solid var(--panelLine);border-radius:10px;padding:2px;background:#fff}
.colorrow{display:flex;align-items:center;gap:10px}
.colorrow code{color:var(--panelMuted);direction:ltr}
.panel input[type=range]{width:100%;accent-color:var(--panelAccent)}
.sw{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--panelAccent)}
.imgpick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imgpick .pv{width:72px;height:54px;border-radius:10px;border:1px dashed var(--panelLine);background:var(--panelSoft) center/contain no-repeat;flex:none}
.btn{border:1px solid var(--panelLine);background:#fff;color:var(--panelText);border-radius:10px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panelSoft)}
.btn.pri{background:var(--panelAccent);border-color:var(--panelAccent);color:#fff}
.btn.danger{color:#c0262d;border-color:#f3c6c8}
.btn.danger:hover{background:#fdecec}
.btn.sm{padding:5px 10px;font-size:.9em}
.btn.close{background:var(--panelSoft)}
.catlist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.catlist button{border:1px solid var(--panelLine);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--panelText)}
.catlist button.on{background:var(--panelText);color:#fff;border-color:var(--panelText)}
.qitem{border:1px solid var(--panelLine);border-radius:14px;margin-top:12px;background:#fff}
.qitem>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
.qitem>summary::-webkit-details-marker{display:none}
.qitem>summary .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--panelSoft);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.qitem>summary .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem[open]>summary{border-bottom:1px solid var(--panelLine)}
.qitem .qb{padding:14px;display:flex;flex-direction:column;gap:14px}
.chrow{display:flex;align-items:center;gap:8px}
.chrow input[type=radio]{width:20px;height:20px;accent-color:#16a34a;flex:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preview-font{border:1px solid var(--panelLine);border-radius:12px;padding:14px;font-size:1.4em;background:var(--panelSoft)}
.note{background:var(--panelSoft);border-radius:12px;padding:12px 14px;color:var(--panelMuted);line-height:1.7}
@media (max-width:720px){
  .panel{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);height:100%}
  .tabs{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--panelLine)}
  .tabs button{white-space:nowrap}
  .pbody{padding:16px}
}
.dlg{background:var(--panel);color:var(--panelText);font-family:'Tajawal',sans-serif;border-radius:18px;padding:22px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.dlg .toolbar{justify-content:flex-start}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:100;background:#1d1a3a;color:#fff;padding:10px 18px;border-radius:12px;font-family:'Tajawal',sans-serif;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
document.documentElement.lang = 'ar';
document.documentElement.dir = 'rtl';
const $ = s => document.querySelector(s);

/* ---------------- storage (IndexedDB, falls back to memory) ---------------- */
const DB = {
  db: null,
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('quiz-app', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  async get(k) {
    if (!this.db) return undefined;
    try { return await new Promise((res, rej) => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
    catch (e) { return undefined; }
  },
  async set(k, v) {
    if (!this.db) return false;
    try { await new Promise((res, rej) => { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
    catch (e) { return false; }
  }
};

function merge(base, over) {
  if (!over || typeof over !== 'object' || Array.isArray(base)) return over === undefined ? base : over;
  const out = { ...base };
  for (const k in over) out[k] = (base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) ? merge(base[k], over[k]) : over[k];
  return out;
}

/* ---------------- cloud database (artifact db + assets) ----------------
   Layout: quiz/settings (one doc), categories/<id> (name, icon, color, image, order),
   questions/<id> (catId, order, text, choices[], correct, points, explain, image, gift).
   Images live in assets; rows hold "/_blob/<id>". Custom sounds stay on this device. */
const Cloud = { db: null, assets: null, user: null, on: false, canWrite: false, synced: {}, busy: false, again: false, status: 'local', err: '', live: {} };
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v);
}
function cloudDocs(state) {
  const out = {};
  const st = JSON.parse(JSON.stringify(state.settings));
  st.correctPop.customSound = ''; st.wrongPop.customSound = '';
  out['quiz/settings'] = { settings: st, v: state.v || 2 };
  state.categories.forEach((c, i) => {
    out['categories/' + c.id] = { name: c.name || '', icon: c.icon || '', color: c.color || '', image: c.image || '', order: i };
    c.questions.forEach((q, j) => {
      out['questions/' + q.id] = { catId: c.id, order: j, text: q.text || '', choices: q.choices || [], correct: +q.correct || 0, points: +q.points || 0, explain: q.explain || '', image: q.image || '', gift: !!q.gift };
    });
  });
  return out;
}
function setCloudStatus(status, err) {
  Cloud.status = status; Cloud.err = err || '';
  const txt = { saving: 'جارٍ الحفظ في قاعدة البيانات…', saved: 'محفوظ في قاعدة البيانات', error: 'تعذر الحفظ في قاعدة البيانات', readonly: 'قاعدة البيانات للقراءة فقط', local: 'محفوظ في هذا المتصفح فقط', loading: 'جارٍ تحميل قاعدة البيانات…', offline: 'قاعدة البيانات غير متاحة الآن، يعمل البرنامج بالنسخة المحلية' }[status] || '';
  const el = $('#saved'); if (el) el.textContent = txt + (err ? ' (' + err + ')' : '');
  const n = $('#cloudnote'); n.textContent = txt; n.hidden = !['saving', 'error', 'loading', 'offline'].includes(status);
}
async function cloudSync() {
  if (!Cloud.on || !Cloud.canWrite) return;
  if (Cloud.busy) { Cloud.again = true; return; }
  Cloud.busy = true; setCloudStatus('saving');
  let err = '';
  try {
    const docs = cloudDocs(S);
    for (const [path, body] of Object.entries(docs)) {
      const js = stable(body);
      if (Cloud.synced[path] === js) continue;
      if (js.length > 250000) { err = 'ملف كبير'; continue; }
      try { await Cloud.db.doc(path).set(body); Cloud.synced[path] = js; }
      catch (e) {
        err = e && e.code || 'خطأ';
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await Cloud.db.doc(path).set(body); Cloud.synced[path] = js; err = ''; } catch (e2) {} }
        if (e && (e.code === 'quota_exceeded' || e.code === 'revoked')) break;
      }
    }
    for (const path of Object.keys(Cloud.synced)) {
      if (docs[path]) continue;
      try { await Cloud.db.doc(path).delete(); delete Cloud.synced[path]; } catch (e) { err = e && e.code || 'خطأ'; }
    }
  } finally {
    Cloud.busy = false;
    setCloudStatus(err ? 'error' : 'saved', err === 'quota_exceeded' ? 'امتلأت المساحة' : err);
    if (Cloud.again) { Cloud.again = false; cloudSync(); }
  }
}
function buildFromCloud(stBody, catRows, qRows, local) {
  const settings = merge(defaults().settings, (stBody && stBody.settings) || {});
  settings.correctPop.customSound = local.settings.correctPop.customSound || '';
  settings.wrongPop.customSound = local.settings.wrongPop.customSound || '';
  const cats = catRows.map(r => ({ id: r.id, name: r.name, icon: r.icon, color: r.color, image: r.image, _o: r.order ?? 0, questions: [] })).sort((a, b) => a._o - b._o);
  qRows.slice().sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).forEach(q => {
    const c = cats.find(x => x.id === q.catId); if (!c) return;
    c.questions.push({ id: q.id, text: q.text, choices: Array.isArray(q.choices) ? q.choices.slice() : [], correct: q.correct || 0, points: q.points ?? 1, explain: q.explain || '', image: q.image || '', gift: !!q.gift });
  });
  cats.forEach(c => delete c._o);
  return { v: 2, settings, categories: cats };
}
const rowsOf = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
function markSynced(stSnap, cSnap, qSnap) {
  Cloud.synced = {};
  if (stSnap && stSnap.exists) Cloud.synced['quiz/settings'] = stable(stSnap.data());
  cSnap.docs.forEach(d => Cloud.synced['categories/' + d.id] = stable(d.data()));
  qSnap.docs.forEach(d => Cloud.synced['questions/' + d.id] = stable(d.data()));
}
async function dataUrlToBlob(u) { return (await fetch(u)).blob(); }
function fontType(bytes) {
  const sig = String.fromCharCode(...bytes.slice(0, 4));
  return sig === 'wOF2' ? 'font/woff2' : sig === 'wOFF' ? 'font/woff' : sig === 'OTTO' ? 'font/otf' : 'font/ttf';
}
async function uploadBlob(blob, type) {
  const r = await Cloud.assets.upload(blob, type ? { type } : undefined);
  return '/_blob/' + r.id;
}
async function uploadDataUrl(u, isFont) {
  const blob = await dataUrlToBlob(u);
  let type = blob.type;
  if (isFont) type = fontType(new Uint8Array(await blob.slice(0, 4).arrayBuffer()));
  return uploadBlob(blob, type);
}
/* every image/font field in the quiz, as [object, key, isFont] */
function mediaFields(state) {
  const st = state.settings, f = [[st, 'logo'], [st, 'homeBg'], [st, 'appBg'], [st.correctPop, 'image'], [st.wrongPop, 'image'], [st, 'customFont', true]];
  (st.gifts?.list || []).forEach(g => f.push([g, 'image']));
  state.categories.forEach(c => { f.push([c, 'image']); c.questions.forEach(q => f.push([q, 'image'])); });
  return f;
}
async function migrateMedia(state, onProgress) {
  const todo = mediaFields(state).filter(([o, k]) => typeof o[k] === 'string' && o[k].startsWith('data:'));
  let done = 0, failed = 0;
  for (const [o, k, isFont] of todo) {
    try { o[k] = await uploadDataUrl(o[k], isFont); } catch (e) { failed++; }
    done++; onProgress && onProgress(done, todo.length);
  }
  return { total: todo.length, failed };
}
async function storeImage(file, max) {
  const d = await readImage(file, max);
  if (!Cloud.on || !Cloud.assets) return d;
  try { return await uploadDataUrl(d); }
  catch (e) { toast('تعذر رفع الصورة إلى قاعدة البيانات، حاول مرة أخرى'); throw e; }
}
async function cloudInit(local) {
  if (!window.claude || !window.claude.use) return;
  try { Cloud.db = await window.claude.use('db'); } catch (e) { Cloud.db = null; }
  if (!Cloud.db) return;
  try { Cloud.user = await window.claude.use('user'); } catch (e) { Cloud.user = null; }
  try { Cloud.canWrite = Cloud.user ? (await Cloud.user.canEdit()) : false; } catch (e) { Cloud.canWrite = false; }
  if (Cloud.canWrite) { try { Cloud.assets = await window.claude.use('assets'); } catch (e) { Cloud.assets = null; } }
  setCloudStatus('loading');
  let stSnap, cSnap, qSnap;
  try {
    [stSnap, cSnap, qSnap] = await Promise.race([
      Promise.all([Cloud.db.doc('quiz/settings').get(), Cloud.db.collection('categories').get(), Cloud.db.collection('questions').get()]),
      new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 10000))]);
  } catch (e) { setCloudStatus('offline'); return; }
  Cloud.on = true;
  const empty = !stSnap.exists && cSnap.empty && qSnap.empty;
  if (empty) {
    if (!Cloud.canWrite) { setCloudStatus('readonly'); return; }
    /* first run: move this device's quiz into the database, images included */
    S = JSON.parse(JSON.stringify(local));
    if (Cloud.assets) await migrateMedia(S, (d, t) => { $('#cloudnote').hidden = false; $('#cloudnote').textContent = `جارٍ رفع الصور إلى قاعدة البيانات ${d} من ${t}`; });
    await DB.set('state', S); await applyTheme(); refresh();
    await cloudSync(); toast('تم نقل المسابقة إلى قاعدة البيانات');
  } else {
    markSynced(stSnap, cSnap, qSnap);
    S = buildFromCloud(stSnap.exists ? stSnap.data() : null, rowsOf(cSnap), rowsOf(qSnap), local);
    await DB.set('state', S); await applyTheme(); refresh();
    setCloudStatus(Cloud.canWrite ? 'saved' : 'readonly');
  }
  cloudListen();
}
/* live updates from other devices / editors; our own writes echo back identical and are ignored */
function cloudListen() {
  const L = Cloud.live;
  let timer = null;
  const maybeApply = () => {
    if (!L.st || !L.c || !L.q) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (Cloud.busy || saveTimer) return maybeApply();
      const incoming = {};
      if (L.st.exists) incoming['quiz/settings'] = stable(L.st.data());
      L.c.docs.forEach(d => incoming['categories/' + d.id] = stable(d.data()));
      L.q.docs.forEach(d => incoming['questions/' + d.id] = stable(d.data()));
      const keys = new Set([...Object.keys(incoming), ...Object.keys(Cloud.synced)]);

  let best = null;

    const r = Math.ceil(n / c);

    ['ثقافة عامة', 'ما هي عاصمة اليابان؟', 'بكين', 'طوكيو', 'سيول', 'بانكوك', '', '', 2, 1, 'طوكيو هي عاصمة اليابان'],
    ['دين', 'كم عدد أركان الإسلام؟', '3', '4', '5', '6', '', '', 3, 1, ''],
    ['علوم', 'ما الرمز الكيميائي للذهب؟', 'Ag', 'Au', 'Fe', '', '', '', 2, 2, '']);
  const ws = X.utils.aoa_to_sheet(rows); ws['!cols'] = XL_HEAD.map((_, i) => ({ wch: i === 1 ? 42 : i === 10 ? 30 : 14 }));
  const wb = X.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] }; X.utils.book_append_sheet(wb, ws, 'الأسئلة');
  try { X.writeFile(wb, withData ? (S.settings.title || 'الأسئلة') + '.xlsx' : 'قالب-الأسئلة.xlsx'); } catch (e) {}
  toast('إذا لم يبدأ التنزيل، شغّل البرنامج من الملف على جهازك');
}
const toLatin = v => String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
function parseRows(rows) {
  rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
  let map = { cat: 0, q: 1, ch: [2, 3, 4, 5], correct: 6, pts: 7, exp: 8 };
  const hd = (rows[0] || []).map(c => String(c).trim());
  if (hd.some(c => c.includes('السؤال'))) {
    map = { cat: -1, q: -1, ch: [], correct: -1, pts: -1, exp: -1 };
    hd.forEach((c, i) => {
      if (c.includes('القسم') || c.includes('الفئة')) map.cat = i;
      else if (c.includes('الصحيح') || c === 'الإجابة' || c.includes('الجواب')) map.correct = i;
      else if (c.includes('السؤال')) map.q = i;
      else if (c.includes('اختيار') || c.includes('خيار')) map.ch.push(i);
      else if (c.includes('نقاط') || c.includes('النقاط') || c.includes('درجة')) map.pts = i;
      else if (c.includes('شرح') || c.includes('معلومة')) map.exp = i;
    });
    rows = rows.slice(1);
  }
  const items = []; let skipped = 0;
  rows.forEach(r => {
    const g = i => i >= 0 ? String(r[i] ?? '').trim() : '';
    const text = g(map.q), choices = map.ch.map(g).filter(Boolean).slice(0, 6);
    if (!text || choices.length < 2) { skipped++; return; }
    const cv = g(map.correct), n = parseInt(toLatin(cv), 10); let ci = 0;
    if (n >= 1 && n <= choices.length) ci = n - 1;
    else if (LETTERS.indexOf(cv) >= 0 && LETTERS.indexOf(cv) < choices.length) ci = LETTERS.indexOf(cv);
    else if (choices.indexOf(cv) >= 0) ci = choices.indexOf(cv);
    items.push({ cat: g(map.cat) || 'أسئلة مستوردة', q: { id: uid(), text, image: '', choices, correct: ci, points: +toLatin(g(map.pts)) || 1, explain: g(map.exp) } });
  });
  return { items, skipped };
}
async function excelImport() {
  const f = await pickFile('.xlsx,.xls,.csv,.ods'); if (!f) return;
  let X; try { X = await loadXLSX(); } catch (e) { return toast('تعذر تحميل أداة Excel، تأكد من الاتصال بالإنترنت'); }
  let rows;
  try { const isText = /\.(csv|txt)$/i.test(f.name); const wb = isText ? X.read(await f.text(), { type: 'string' }) : X.read(await f.arrayBuffer()); rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }); }
  catch (e) { return toast('تعذر قراءة الملف. تأكد أنه ملف Excel أو CSV'); }
  const res = parseRows(rows);
  if (!res.items.length) return toast('لم أجد أسئلة في الملف. استخدم القالب كمثال');
  const cats = new Set(res.items.map(x => x.cat));
  dialog(box => box.append(
    h('b', {}, `وجدت ${res.items.length} سؤال في ${cats.size} ${cats.size > 2 ? 'أقسام' : 'قسم'}: ${[...cats].join('، ')}`),
    res.skipped ? h('span', { class: 'hint' }, `تم تجاهل ${res.skipped} صف ناقص (كل سؤال يحتاج نصاً واختيارين على الأقل)`) : null,
    h('div', { class: 'toolbar' },
      h('button', { class: 'btn pri', onclick: () => applyImport(res.items, false) }, 'إضافة إلى الأسئلة الحالية'),
      h('button', { class: 'btn danger', onclick: () => applyImport(res.items, true) }, 'استبدال كل الأسئلة'),
      h('button', { class: 'btn', onclick: closeDialog }, 'إلغاء'))));
}
function applyImport(items, replace) {
  closeDialog();
  if (replace) { S.categories = []; P = newProgress(); saveProgress(); }
  const palette = ['#1f6f63', '#2c5e8c', '#8a5a2b', '#7a2840', '#5b3f8c', '#2f7a4a'];
  items.forEach(({ cat, q }) => {
    let c = S.categories.find(x => x.name === cat);
    if (!c) { c = { id: uid(), name: cat, icon: '', color: palette[S.categories.length % palette.length], image: '', questions: [] }; S.categories.push(c); }
    c.questions.push(q);
  });
  editCat = null; save(); openSettings(); toast(`تم استيراد ${items.length} سؤال`);
}
async function exportData() {
  const data = Cloud.on ? await inlineBlobs(S) : S;
  const blob = new Blob([JSON.stringify({ app: 'quiz-app', state: data }, null, 1)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: (S.settings.title || 'quiz') + '.json' });
  document.body.appendChild(a); a.click(); a.remove();
  toast('إذا لم يبدأ التنزيل، استخدم «نسخ البيانات كنص»');
}
async function copyData() {
  const txt = JSON.stringify({ app: 'quiz-app', state: S });
  try { await navigator.clipboard.writeText(txt); toast('تم النسخ'); }
  catch (e) { dialog(box => { const ta = h('textarea', { style: 'min-height:160px;direction:ltr' }); ta.value = txt; box.append(h('b', {}, 'انسخ النص التالي:'), ta, h('button', { class: 'btn', onclick: closeDialog }, 'إغلاق')); setTimeout(() => ta.select(), 50); }); }
}
async function importData() {
  const f = await pickFile('.json,application/json'); if (!f) return;
  try {
    const data = JSON.parse(await f.text()); const st = data.state || data;
    if (!st.settings || !Array.isArray(st.categories)) throw 0;
    confirmBox('استبدال المسابقة الحالية بالملف المستورد؟', 'استيراد', async () => { S = merge(defaults(), st); S.categories = st.categories; P = newProgress(); editCat = null; if (Cloud.on && Cloud.assets) { toast('جارٍ رفع الصور…'); await migrateMedia(S); } save(); saveProgress(); applyTheme(); openSettings(); toast('تم الاستيراد'); });
  } catch (e) { toast('الملف غير صالح. اختر ملفاً صدّرته من هذا البرنامج'); }
}

/* ---------------- boot ---------------- */
(async () => {
  await DB.open();
  const st = await DB.get('state'); const pr = await DB.get('progress');
  if (st && st.settings) {
    S = merge(defaults(), st); S.categories = st.categories || [];
    if (!(st.v >= 2)) {
      if (st.settings.colors && st.settings.colors.bg === '#17143a') S.settings.colors = { ...THEMES[0][1] };
      if (S.settings.font === 'Cairo') S.settings.font = 'Tajawal';
      if (S.settings.headFont === 'Cairo') S.settings.headFont = 'El Messiri';
      S.v = 2; save();
    }
  }
  if (pr && pr.answers) P = { ...newProgress(), ...pr };
  await applyTheme(); renderHome();
  if (SITE) siteCheck(false); else cloudInit(JSON.parse(JSON.stringify(S)));
})();
})();
